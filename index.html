  /* ── G마켓 산스 Bold (스플래시 구호용) — 상업적 이용 무료, 10° 기울임 ── */
  @font-face {
    font-family:'G마켓산스B';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
    font-weight:700;

  /* ── 스플래시 (구호) ── */
  #splash {
    position:fixed; inset:0; z-index:99999; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:
      radial-gradient(90% 70% at 50% 28%, rgba(255,255,255,.09), transparent 55%),
      radial-gradient(70% 60% at 82% 92%, rgba(0,0,0,.28), transparent 60%),
      linear-gradient(160deg, #d32f2f 0%, #b71c1c 45%, #7f0000 100%);
  }
  #splash::before {
    content:''; position:absolute; inset:-40%;
    background:
      radial-gradient(30% 30% at 25% 25%, rgba(255,255,255,.11), transparent 60%),
      radial-gradient(25% 25% at 75% 70%, rgba(255,255,255,.07), transparent 60%);
    animation: spSheen 3.4s ease-in-out infinite alternate;
  }
  @keyframes spSheen { from{transform:translate(-2%,-2%)} to{transform:translate(2%,2%)} }
  #splash .sp-line {
    font-family:'G마켓산스B','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    font-weight:700;
    color:#fff; opacity:0;
    text-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  #splash .sp-1 { font-size:34px; animation:spIn .55s cubic-bezier(.2,1.4,.4,1) .25s forwards; }
  #splash .sp-2 { font-size:34px; animation:spIn .55s cubic-bezier(.2,1.4,.4,1) .95s forwards; }
  #splash .sp-3 { font-size:38px; color:#ffd54f; animation:spIn .55s cubic-bezier(.2,1.4,.4,1) 1.65s forwards; }
  #splash .sp-4 { font-size:54px; animation:spStamp .6s cubic-bezier(.2,1.6,.4,1) 2.35s forwards; }
  @keyframes spIn {
    from { opacity:0; transform:translateY(18px) scale(.85) skewX(-10deg); }
    to { opacity:1; transform:skewX(-10deg); }
  }
  @keyframes spStamp {
    0% { opacity:0; transform:scale(1.8) skewX(-10deg); }
    60% { opacity:1; transform:scale(.92) skewX(-10deg); }
    100% { opacity:1; transform:scale(1) skewX(-10deg); }
  }
  #splash .bang { color:#ffd54f; }
  #splash .sp-foot {
    position:absolute; bottom:42px; left:0; right:0; text-align:center;
    font-size:12.5px; letter-spacing:5px; color:rgba(255,255,255,.75);
    opacity:0; animation:spFoot .6s ease 3.0s forwards;
  }
  @keyframes spFoot { to { opacity:1; } }
  #splash.splash-done { animation:spOut .65s ease forwards; }
  @keyframes spOut { to { opacity:0; visibility:hidden; } }

<script>
/* ── 안전망: 앱 스크립트와 분리된 스플래시 숨김 ──
   앱 스크립트가 어떤 이유로 죽어도(붙여넣기 깨짐 포함) 화면은 반드시 넘어갑니다. */
(function(){
  function hide(){var sp=document.getElementById('splash');if(sp){sp.classList.add('splash-done');setTimeout(function(){if(sp)sp.style.display='none';},700);}}
  setTimeout(hide,3450);
  window.addEventListener('error',function(e){
    hide();
    try{
      var box=document.getElementById('fatal');
      if(box){box.style.display='block';box.textContent='[오류] '+(String((e&&e.message)||e||'알 수 없는 오류')).slice(0,300)+' — 이 문구를 개발 담당에게 보여주세요';}
    }catch(err){}
  });
})();
</script>
