<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진보당 광주시지역협의회 사무국</title>
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16-v2.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32-v2.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-192-v2.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C0392B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    body { margin:0; font-family:sans-serif; }
    iframe { width:100%; height:100vh; border:0; }
  </style>
</head>
<body>
  <!-- ★ 이 부분에 GAS 웹 앱 URL을 넣으세요 (배포 시 주소 그대로 유지됨)
       allow="microphone" 필수: iframe 안에서 녹음(회의 기능)하려면 이 권한이 있어야 함 -->
  <iframe src="https://script.google.com/macros/s/AKfycbzwWHSa7-y6Z2OlTlLOdxqbXpmYt4xM_na0Ek7OwovWZ_mujxixaAlzWmLYAzMX8BlAZw/exec" allow="microphone" allowfullscreen></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    /* ── 로그인 유지 ──
       iframe(GAS 앱)의 저장소는 브라우저가 지울 수 있어서,
       아이디/비밀번호는 이 페이지(래퍼)에 보관하고 앱 시작 때 다시 전달합니다. */
    (function () {
      var frame = document.querySelector('iframe');
      function pushCreds() {
        try {
          var pin = localStorage.getItem('office-pin') || '';
          var name = localStorage.getItem('office-name') || '';
          if (pin || name) frame.contentWindow.postMessage({ type: 'office-creds', pin: pin, name: name }, '*');
        } catch (e) {}
      }
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || typeof d !== 'object' || typeof d.type !== 'string') return;
        if (d.type === 'office-creds') {
          try {
            if (d.pin) localStorage.setItem('office-pin', d.pin);
            if (d.name) localStorage.setItem('office-name', d.name);
          } catch (e2) {}
        } else if (d.type === 'office-logout') {
          try { localStorage.removeItem('office-pin'); localStorage.removeItem('office-name'); } catch (e3) {}
        }
      });
      if (frame) {
        frame.addEventListener('load', pushCreds);
        if (frame.contentWindow) pushCreds();
      }
    })();
  </script>
</body>
</html>
